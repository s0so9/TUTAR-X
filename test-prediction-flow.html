<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Flow Debug</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
    }
    .test-section h3 {
      margin-top: 0;
      color: #4ec9b0;
    }
    .status {
      padding: 5px 10px;
      margin: 5px 0;
      border-radius: 3px;
    }
    .status.loading {
      background: #1e3a8a;
      color: #93c5fd;
    }
    .status.success {
      background: #14532d;
      color: #86efac;
    }
    .status.error {
      background: #7f1d1d;
      color: #fca5a5;
    }
    button {
      padding: 8px 15px;
      margin: 5px;
      background: #0e639c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #1177bb;
    }
    pre {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .log-entry {
      margin: 2px 0;
      padding: 3px 8px;
      border-left: 3px solid #4ec9b0;
    }
  </style>
</head>
<body>
  <h1>🔍 Prediction Flow Debugger</h1>

  <div class="test-section">
    <h3>Test Match</h3>
    <p><strong>Date:</strong> 10 Oct 2026 04:30</p>
    <p><strong>Status:</strong> scheduled</p>
    <p><strong>Home Team ID:</strong> 9825</p>
    <p><strong>Away Team ID:</strong> 8463</p>
    <p><strong>Match ID:</strong> <span id="match-id-display">Loading...</span></p>
    <button onclick="findMatch()">1. Find Match by Teams & Date</button>
  </div>

  <div class="test-section">
    <h3>Prediction Request</h3>
    <div id="request-status" class="status">Not started</div>
    <button onclick="testPrediction()">2. Test Prediction Request</button>
    <button onclick="testWithAbort()">3. Test with AbortController</button>
  </div>

  <div class="test-section">
    <h3>Response</h3>
    <pre id="response-output">No response yet</pre>
  </div>

  <div class="test-section">
    <h3>Debug Log</h3>
    <div id="debug-log"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000/api/v1';
    let matchId = null;
    let abortController = null;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('debug-log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
      entry.textContent = `[${timestamp}] ${message}`;
      logDiv.appendChild(entry);
      console.log(message);
    }

    async function findMatch() {
      log('🔍 Searching for match with teams 9825 vs 8463 on 2026-10-10...');

      try {
        const response = await fetch(`${API_BASE}/matches?status=scheduled&limit=100`);
        const data = await response.json();

        log(`✓ Fetched ${data.matches.length} scheduled matches`);

        // Find match by team IDs and date
        const targetDate = '2026-10-10';
        const match = data.matches.find(m =>
          (m.home_team_id === 9825 || m.home_team_id === '9825') &&
          (m.away_team_id === 8463 || m.away_team_id === '8463') &&
          m.scheduled_at.startsWith(targetDate)
        );

        if (match) {
          matchId = match.id;
          document.getElementById('match-id-display').textContent = matchId;
          log(`✓ Found match: ${matchId}`);
          log(`  Home: ${match.home_team_id} (${match.home_team_name || 'N/A'})`);
          log(`  Away: ${match.away_team_id} (${match.away_team_name || 'N/A'})`);
          log(`  Date: ${match.scheduled_at}`);
          log(`  Competition: ${match.competition_id}`);
        } else {
          log('✗ Match not found in API response');
          log('Available matches:', 'info');
          data.matches.slice(0, 5).forEach(m => {
            log(`  ${m.id}: ${m.home_team_id} vs ${m.away_team_id} @ ${m.scheduled_at}`);
          });
        }
      } catch (err) {
        log(`✗ Error finding match: ${err.message}`, 'error');
      }
    }

    async function testPrediction() {
      if (!matchId) {
        log('✗ No match ID. Run step 1 first.', 'error');
        return;
      }

      const statusDiv = document.getElementById('request-status');
      const outputDiv = document.getElementById('response-output');

      statusDiv.className = 'status loading';
      statusDiv.textContent = '⏳ Loading prediction...';
      log(`📡 GET ${API_BASE}/matches/${matchId}/prediction`);

      const startTime = Date.now();

      try {
        const response = await fetch(`${API_BASE}/matches/${matchId}/prediction`);
        const elapsed = Date.now() - startTime;

        log(`✓ Response received in ${elapsed}ms (status: ${response.status})`);

        if (response.ok) {
          const data = await response.json();
          statusDiv.className = 'status success';
          statusDiv.textContent = `✓ Success (${elapsed}ms)`;
          outputDiv.textContent = JSON.stringify(data, null, 2);

          log(`✓ Prediction loaded successfully`);
          log(`  TUTAR: ${data.best_tip?.tutar_x || 'N/A'}`);
          log(`  Confidence: ${data.best_tip?.confidence || 'N/A'}`);
          log(`  Market: ${data.best_tip?.market_name || 'N/A'}`);

          if (data.mensione_pick) {
            log(`  Mensione: ${data.mensione_pick.pass_decision ? 'PASS' : data.mensione_pick.market}`);
          }
        } else {
          const text = await response.text();
          statusDiv.className = 'status error';
          statusDiv.textContent = `✗ HTTP ${response.status}`;
          outputDiv.textContent = text;
          log(`✗ HTTP ${response.status}: ${text}`, 'error');
        }
      } catch (err) {
        const elapsed = Date.now() - startTime;
        statusDiv.className = 'status error';
        statusDiv.textContent = `✗ ${err.name}: ${err.message}`;
        outputDiv.textContent = err.stack;
        log(`✗ Request failed after ${elapsed}ms: ${err.message}`, 'error');
      }
    }

    async function testWithAbort() {
      if (!matchId) {
        log('✗ No match ID. Run step 1 first.', 'error');
        return;
      }

      const statusDiv = document.getElementById('request-status');
      const outputDiv = document.getElementById('response-output');

      abortController = new AbortController();

      statusDiv.className = 'status loading';
      statusDiv.textContent = '⏳ Loading prediction (with AbortController)...';
      log(`📡 GET ${API_BASE}/matches/${matchId}/prediction (with AbortSignal)`);

      const startTime = Date.now();

      try {
        const response = await fetch(`${API_BASE}/matches/${matchId}/prediction`, {
          signal: abortController.signal
        });
        const elapsed = Date.now() - startTime;

        log(`✓ Response received in ${elapsed}ms (status: ${response.status})`);

        if (response.ok) {
          const data = await response.json();
          statusDiv.className = 'status success';
          statusDiv.textContent = `✓ Success with AbortController (${elapsed}ms)`;
          outputDiv.textContent = JSON.stringify(data, null, 2);
          log(`✓ Prediction loaded successfully with AbortController`);
        } else {
          const text = await response.text();
          statusDiv.className = 'status error';
          statusDiv.textContent = `✗ HTTP ${response.status}`;
          outputDiv.textContent = text;
          log(`✗ HTTP ${response.status}: ${text}`, 'error');
        }
      } catch (err) {
        const elapsed = Date.now() - startTime;

        if (err.name === 'AbortError') {
          statusDiv.className = 'status error';
          statusDiv.textContent = '✗ Request aborted';
          outputDiv.textContent = 'Request was aborted';
          log(`⚠ Request aborted after ${elapsed}ms`);
        } else {
          statusDiv.className = 'status error';
          statusDiv.textContent = `✗ ${err.name}: ${err.message}`;
          outputDiv.textContent = err.stack;
          log(`✗ Request failed after ${elapsed}ms: ${err.message}`, 'error');
        }
      }
    }

    // Auto-run on page load
    window.onload = () => {
      log('🚀 Prediction Flow Debugger loaded');
      log(`📍 API Base: ${API_BASE}`);
    };
  </script>
</body>
</html>
